<!DOCTYPE html>
<html>
<head>
<title>K8s Real Dashboard</title>

<style>
body {
  background: #0b1220;
  color: white;
  font-family: Arial;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 15px;
  margin: 10px;
  border-radius: 12px;
}

.ok { color: #22c55e; }
.bad { color: #ef4444; }
</style>

</head>

<body>

<h2>🚀 Kubernetes Live Dashboard</h2>

<div class="card">
  <h3>Pods</h3>
  <pre id="pods">Loading...</pre>
</div>

<div class="card">
  <h3>Services</h3>
  <pre id="svc">Loading...</pre>
</div>

<script>
async function load() {
  const pods = await fetch("http://localhost:3000/pods").then(r=>r.json());
  const svc = await fetch("http://localhost:3000/services").then(r=>r.json());

  document.getElementById("pods").innerText =
    JSON.stringify(pods.items.map(p => ({
      name: p.metadata.name,
      status: p.status.phase
    })), null, 2);

  document.getElementById("svc").innerText =
    JSON.stringify(svc.items.map(s => ({
      name: s.metadata.name,
      type: s.spec.type,
      port: s.spec.ports
    })), null, 2);
}

load();
setInterval(load, 5000);
</script>

</body>
</html>
